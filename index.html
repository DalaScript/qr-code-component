<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A responsive QR code component challenge solution from Frontend Mentor.">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <!-- Font ('Outfit') -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <title>QR Code Component | Frontend Mentor</title>

    <!-- Styles -->
    <link rel="stylesheet" href="./assets/styles/styles.css">
</head>

<body>
    <main class="page">
        <article class="card">
            <figure class="card__figure">
                <a class="card__link" href="https://www.frontendmentor.io" target="_blank" rel="noopener noreferrer"
                    aria-label="Visit Frontend Mentor (opens in a new tab)">
                    <img class="card__image" src="./assets/images/image-qr-code.png"
                        alt="QR code to visit Frontend Mentor" width="288" height="288" loading="lazy" decoding="async">
                </a>

                <figcaption class="card__content">
                    <h1 class="card__title">
                        Improve your front-end skills by building projects
                    </h1>

                    <p class="card__description">
                        Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
                    </p>
                </figcaption>
            </figure>
        </article>
    </main>
</body>

</html>
